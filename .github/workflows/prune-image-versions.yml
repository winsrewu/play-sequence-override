name: Prune image versions

# Keeps the newest non-version image versions and deletes the rest. Versions
# that carry a version tag (0.4, 0.4.1, v0.4, 1.0.0-rc.1) are never touched.
# GITHUB_TOKEN needs Admin access to the package (Package settings -> Manage
# Actions access); otherwise set a classic PAT with read:packages +
# delete:packages as the GHCR_TOKEN secret.
on:
  schedule:
    - cron: "45 11 * * *"
  workflow_dispatch:
    inputs:
      keep:
        description: How many non-version image versions to keep
        default: "5"

permissions:
  contents: read
  packages: write

concurrency:
  group: prune-image-versions
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: ${{ inputs.keep || 5 }}
          ignore-versions: '^v?[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          token: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
