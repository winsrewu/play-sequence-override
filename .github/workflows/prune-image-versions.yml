name: Prune image versions

# Keeps the newest non-version image versions and deletes the rest. Versions
# that carry a version tag (0.4, 0.4.1, v0.4) are never touched.
on:
  schedule:
    - cron: "45 11 * * *"
  workflow_dispatch:
    inputs:
      keep:
        description: How many non-version image versions to keep
        default: "5"
      dry_run:
        description: List what would be deleted without deleting it
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: prune-image-versions
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          PACKAGE: ${{ github.event.repository.name }}
          KEEP: ${{ inputs.keep || '5' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          package="${PACKAGE,,}"
          version_re='^v?[0-9]+\.[0-9]+(\.[0-9]+)*$'
          if ! [[ "${KEEP}" =~ ^[0-9]+$ ]] || (( KEEP < 1 )); then
            echo "::error::keep must be a positive integer, got ${KEEP}"
            exit 1
          fi

          # A package is addressable only when it is linked to this repository
          # and is spelled the way GHCR stored it. Fall back to the repository's
          # container package list instead of assuming it never existed.
          resolve() {
            gh api --paginate --jq '.[]' \
              "repos/${REPOSITORY}/packages/container/$1/versions?per_page=100" \
              > versions.ndjson 2> error.txt
          }

          if ! resolve "${package}"; then
            if ! grep -qi "HTTP 404" error.txt; then
              cat error.txt >&2
              exit 1
            fi
            names=$(gh api "repos/${REPOSITORY}/packages?package_type=container" \
              --jq '.[].name' 2> /dev/null || true)
            count=$(printf '%s\n' "${names}" | grep -c . || true)
            match=$(printf '%s\n' "${names}" | grep -i -F -x "${package}" | head -n 1 || true)
            if [ -n "${match}" ]; then
              echo "::notice::Using package '${match}' (cased differently than the expected name)."
              resolve "${match}" || { cat error.txt >&2; exit 1; }
              package="${match}"
            elif [ "${count}" = "1" ]; then
              only=$(printf '%s\n' "${names}" | head -n 1)
              echo "::notice::Using the repository's only container package '${only}'."
              resolve "${only}" || { cat error.txt >&2; exit 1; }
              package="${only}"
            else
              echo "::notice::No container package '${package}' under ${REPOSITORY}. Linked container packages: [$(printf '%s\n' "${names}" | paste -sd, -)]. Check ${SERVER}/${REPOSITORY}/actions/workflows/docker.yml; if the image exists but is not linked, link the package to this repository."
              exit 0
            fi
          fi

          api="repos/${REPOSITORY}/packages/container/${package}/versions"

          # Version-tagged images are protected; everything else is sorted
          # newest first and only the first KEEP survive.
          jq -s --arg re "${version_re}" '
            [ .[]
              | select(((.metadata.container.tags // []) | map(select(test($re))) | length) == 0)
            ]
            | sort_by(.created_at) | reverse
          ' versions.ndjson > candidates.json

          total=$(jq 'length' candidates.json)
          kept=$(( total < KEEP ? total : KEEP ))
          echo "package ${package}: ${total} non-version versions; keeping ${kept}, deleting $(( total - kept ))"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry run: no versions will be deleted"
          fi

          jq -r --argjson keep "${KEEP}" '.[$keep:][] | .id' candidates.json > stale.txt
          while read -r id; do
            [ -n "${id}" ] || continue
            if [ "${DRY_RUN}" = "true" ]; then
              echo "would delete version ${id}"
            else
              gh api -X DELETE "${api}/${id}"
              echo "deleted version ${id}"
            fi
          done < stale.txt
