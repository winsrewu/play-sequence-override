name: Prune image versions

# Keeps the newest 5 images that carry no version tag and deletes the rest.
# Version-tagged images (0.4, 0.4.1, v0.4, 1.0.0-rc.1) are excluded from every
# rule and can never be deleted. The packages REST API needs Admin access for
# GITHUB_TOKEN (Package settings -> Manage Actions access); otherwise set a
# classic PAT with read:packages + delete:packages as GHCR_TOKEN.
on:
  schedule:
    - cron: "45 11 * * *"
  workflow_dispatch:
    inputs:
      keep:
        description: How many non-version image versions to keep
        default: "5"
      dry_run:
        description: List what would be deleted without deleting it
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: prune-image-versions
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          package: ${{ github.event.repository.name }}
          # Tags, not version names: the official action matches digests here.
          exclude-tags: latest,main,*.*
          use-regex: true
          keep-n-tagged: ${{ inputs.keep || 5 }}
          delete-untagged: true
          dry-run: ${{ inputs.dry_run || false }}
