name: Release plugin

# VERSION is the single source of truth. When a tag v<version> is pushed (by the
# version-tag workflow or by hand), package the extension and publish it as a
# GitHub release asset on that tag. The release archive keeps the manifest key,
# so the extension id stays the store id when it is loaded unpacked; the store
# upload drops that field instead. Tags pushed with GITHUB_TOKEN do not trigger
# workflows by themselves, so version-tag.yml also dispatches this one at the
# tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 scripts/version.py)
          python3 scripts/version.py --check
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow at a release tag, got ${GITHUB_REF:-$REF_NAME}"
            exit 1
          fi
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match VERSION $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: python3 scripts/package_extension.py --keep-key

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          asset="dist/play-sequence-override-$VERSION-unpacked.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi
